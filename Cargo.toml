[package]
name = "able-converter"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/p-prakapienka/able-converter"

[[example]]
name = "inspect"
path = "src/tools/inspect.rs"

[dependencies]
flate2 = "1"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
