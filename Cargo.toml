[workspace]
resolver = "2"
members = [
    "crates/mapper-cli",
    "crates/mapper-core",
    "crates/mapper-live",
    "crates/mapper-model",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/p-prakapienka/able-converter"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
