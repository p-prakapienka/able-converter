name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Check WebAssembly adapter
        run: cargo check --target wasm32-unknown-unknown

      - name: Check browser JavaScript
        run: node --input-type=module --check < src/web/frontend/app.js

  browser:
    name: Browser preview
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build browser package
        run: wasm-pack build --target web --out-dir target/browser-preview/pkg

      - name: Stage served preview
        run: node src/web/frontend/stage-preview.mjs --out target/browser-preview

      - name: Build standalone preview
        run: node src/web/frontend/bundle-single-file.mjs --pkg target/browser-preview/pkg --out target/able-converter-preview.html

      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview
          path: target/browser-preview/
          if-no-files-found: error

      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-standalone
          path: target/able-converter-preview.html
          if-no-files-found: error

  windows-tools:
    name: Windows tools
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Build developer tools
        run: cargo build --release --examples

      - name: Upload Windows tools
        uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: target/release/examples/*.exe
          if-no-files-found: error
